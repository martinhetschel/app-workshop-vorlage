name: Deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # nötig für die Anmeldung ohne Schlüssel (WIF)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Bei Google anmelden (WIF, ohne Schlüssel)
        uses: google-github-actions/auth@v3
        with:
          project_id: DEIN-PROJEKT
          workload_identity_provider: projects/DEINE-PROJEKTNUMMER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@DEIN-PROJEKT.iam.gserviceaccount.com
      - name: Veröffentlichen
        run: npx firebase-tools deploy --project=DEIN-PROJEKT --non-interactive --force --only=hosting,firestore:rules
